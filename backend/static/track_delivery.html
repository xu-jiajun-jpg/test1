<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>包裹追踪</title>
<style>
:root{--green:#07C160;--blue:#1989FA;--orange:#FF976A;--red:#EE0A24;--bg:#F2F2F2;--card:#FFFFFF;--text:#333333;--sub:#999999;--line:#EBEDF0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased;max-width:414px;margin:0 auto;padding-bottom:60px}

/* 顶部导航栏 */
.nav{position:sticky;top:0;z-index:100;background:var(--card);padding:env(safe-area-inset-top) 16px 12px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.nav-back{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:18px;cursor:pointer}
.nav-title{font-size:17px;font-weight:600;color:var(--text)}

/* 搜索区 */
.search{background:var(--card);margin:12px 16px;padding:12px;border-radius:12px;display:flex;gap:8px;align-items:center}
.search-icon{color:#C0C4CC;font-size:16px;flex-shrink:0}
.search input{flex:1;border:none;font-size:15px;color:var(--text);outline:none;background:transparent}
.search input::placeholder{color:#C0C4CC}
.search-btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:14px;font-weight:500;flex-shrink:0;cursor:pointer}

/* 结果区域 */
.result{display:none}
.result.show{display:block}

/* ETA卡片 */
.eta-card{background:linear-gradient(135deg,#07C160,#06AD56);color:#fff;margin:0 16px 12px;padding:20px;border-radius:12px;text-align:center}
.eta-card .eta-label{font-size:13px;opacity:.9;margin-bottom:4px}
.eta-card .eta-time{font-size:40px;font-weight:700;line-height:1.2}
.eta-card .eta-info{font-size:12px;opacity:.8;margin-top:6px}

/* 包裹信息卡片 */
.info-card{background:var(--card);margin:0 16px 12px;border-radius:12px;overflow:hidden}
.info-card .info-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.info-card .info-item:last-child{border-bottom:none}
.info-item .info-icon{width:20px;text-align:center;margin-right:12px;font-size:14px;flex-shrink:0}
.info-item .info-label{font-size:14px;color:var(--sub);flex-shrink:0;margin-right:12px}
.info-item .info-value{flex:1;font-size:14px;color:var(--text);text-align:right;font-weight:500}
.info-item .info-value.status{color:var(--green);font-weight:600}

/* 时间线 */
.timeline{background:var(--card);margin:0 16px 12px;border-radius:12px;padding:16px}
.timeline-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:6px}
.timeline-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--green);border-radius:2px}
.tl-item{display:flex;align-items:flex-start;position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-line{position:absolute;left:11px;top:26px;width:2px;height:calc(100% - 26px);background:var(--line)}
.tl-item:last-child .tl-line{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;margin-right:12px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tl-dot.done{background:#C8F7D5;color:var(--green)}
.tl-dot.active{background:var(--green);color:#fff;box-shadow:0 0 0 4px rgba(7,193,96,.2)}
.tl-dot.pending{background:#F5F5F5;color:#C0C4CC}
.tl-body{flex:1;min-width:0}
.tl-node{font-size:15px;color:var(--text);font-weight:500;line-height:24px}
.tl-node.pending{color:var(--sub)}
.tl-time{font-size:12px;color:var(--sub);margin-top:2px}

/* 地图 */
.map-card{background:var(--card);margin:0 16px 12px;border-radius:12px;overflow:hidden}
.map-card .map-title{padding:12px 16px 0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
#map{width:100%;height:200px;border-radius:0}
.map-foot{padding:8px 16px;font-size:11px;color:var(--sub);text-align:center;background:var(--card)}

/* 底部栏 */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:414px;background:var(--card);border-top:1px solid var(--line);padding:12px 16px env(safe-area-inset-bottom);display:flex;gap:12px;z-index:100}
.bottom-bar .bb-btn{flex:1;padding:10px;border-radius:8px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;border:none}
.bb-btn.primary{background:var(--green);color:#fff}
.bb-btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}

/* 空态 */
.empty-box{text-align:center;padding:60px 20px}
.empty-box .empty-icon{font-size:48px;margin-bottom:16px}
.empty-box .empty-text{font-size:15px;color:var(--sub)}
.empty-box .empty-tip{font-size:13px;color:#C0C4CC;margin-top:8px}

/* toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:999;display:none}
.toast.show{display:block;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%,70%{opacity:1}100%{opacity:0}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<!-- 导航栏 -->
<div class="nav">
  <div class="nav-back" onclick="history.back()">‹</div>
  <div class="nav-title">包裹追踪</div>
</div>

<!-- 搜索 -->
<div class="search">
  <span class="search-icon">📦</span>
  <input id="trackNum" type="text" placeholder="请输入运单号" maxlength="30" />
  <button class="search-btn" onclick="track()">查询</button>
</div>

<!-- 结果 -->
<div class="result" id="result">
  <div class="eta-card" id="etaCard"></div>
  <div class="info-card" id="infoCard"></div>
  <div class="timeline" id="timelineBox"></div>
  <div class="map-card">
    <div class="map-title">📍 实时位置</div>
    <div id="map"></div>
    <div class="map-foot">每5秒自动刷新</div>
  </div>
</div>

<!-- 空态 -->
<div class="empty-box" id="emptyBox">
  <div class="empty-icon">📭</div>
  <div class="empty-text">输入运单号查询包裹状态</div>
  <div class="empty-tip">物流分拣平台 · 江西南昌发货</div>
</div>

<!-- 底部栏 -->
<div class="bottom-bar">
  <button class="bb-btn secondary" onclick="document.getElementById('trackNum').value='';document.getElementById('trackNum').focus()">新建查询</button>
  <button class="bb-btn primary" onclick="window.open('/static/track_delivery.html','_self')">刷新页面</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = location.origin + '/api/logistics'
const NODES = ['已揽收','分拣装车','出库配送','区内到达','已签收']
const ICONS = ['📋','📦','🚛','📍','✅']
const NANCHANG = [28.6829, 115.8582]

let map=null,marker=null,timer=null,currentTN=''

// 参数自动查询
;(new URLSearchParams(location.search)).get('tn') && (document.getElementById('trackNum').value=(new URLSearchParams(location.search)).get('tn'),track())

document.getElementById('trackNum').addEventListener('keydown',e=>e.key==='Enter'&&track())

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}

async function track(){
  const tn=document.getElementById('trackNum').value.trim()
  if(!tn) return toast('请输入运单号')
  if(timer) clearInterval(timer)
  currentTN=tn
  await fetchStatus()
  timer=setInterval(fetchStatus,5000)
  document.getElementById('emptyBox').style.display='none'
  document.getElementById('result').classList.add('show')
}

async function fetchStatus(){
  try{
    const r=await fetch(API+'/track/'+currentTN)
    if(!r.ok) throw new Error('查询失败')
    const d=(await r.json()).data
    if(!d) return
    renderStatus(d)
  }catch(e){
    toast('查询失败，请重试')
  }
}

function renderStatus(d){
  document.getElementById('emptyBox').style.display='none'
  document.getElementById('result').classList.add('show')

  // ETA
  const et=document.getElementById('etaCard')
  let etaText='--'
  if(d.eta_minutes>0){
    const h=Math.floor(d.eta_minutes/60),m=Math.round(d.eta_minutes%60)
    etaText=h>0?h+'h'+m+'min':m+'min'
  }else if(d.node_status_code>=7) etaText='已签收'
  else etaText='计算中'
  et.innerHTML=`<div class="eta-label">⏱ 预计到达</div><div class="eta-time">${etaText}</div><div class="eta-info">🚛 ${d.active_vehicle||'未绑定'} · ${d.origin||'南昌'} → ${d.destination||'目的站'}</div>`

  // 信息
  const ic=document.getElementById('infoCard')
  ic.innerHTML=`
    <div class="info-item"><span class="info-icon">📦</span><span class="info-label">运单号</span><span class="info-value">${d.tracking_number}</span></div>
    <div class="info-item"><span class="info-icon">🔵</span><span class="info-label">当前状态</span><span class="info-value status">${d.node_status_name}</span></div>
    <div class="info-item"><span class="info-icon">🏠</span><span class="info-label">发货地</span><span class="info-value">${d.origin||'南昌'}</span></div>
    <div class="info-item"><span class="info-icon">📍</span><span class="info-label">目的地</span><span class="info-value">${d.destination||'--'}</span></div>
    <div class="info-item"><span class="info-icon">🚛</span><span class="info-label">承运车辆</span><span class="info-value">${d.active_vehicle||'待分配'}</span></div>
  `

  // 时间线
  const tb=document.getElementById('timelineBox')
  const lines=NODES.map((name,i)=>{
    let cls='pending',icon=ICONS[i]
    if(i<d.node_status_code) cls='done'
    else if(i===d.node_status_code) cls='active'
    let sub=''
    if(cls==='pending') sub='等待中'
    else if(cls==='active') sub='进行中'
    else sub='已完成'
    return `<div class="tl-item">
      <div class="tl-dot ${cls}">${cls==='done'?'✓':cls==='active'?'●':''}</div>
      <div class="tl-line"></div>
      <div class="tl-body">
        <div class="tl-node${cls==='pending'?' pending':''}">${icon} ${name}</div>
        <div class="tl-time">${sub}</div>
      </div>
    </div>`
  }).join('')
  tb.innerHTML=`<div class="timeline-title">运输节点</div>${lines}`

  // 地图
  initMap(d.vehicle_lat||NANCHANG[0],d.vehicle_lng||NANCHANG[1])
}

function initMap(lat,lng){
  if(!window.L) return
  if(!map){
    map=L.map('map',{attributionControl:false,zoomControl:false}).setView([lat,lng],13)
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      {maxZoom:16,subdomains:['1','2','3','4']}).addTo(map)
  }
  if(marker) map.removeLayer(marker)
  marker=L.marker([lat,lng]).addTo(map).bindPopup('🚛 车辆位置').openPopup()
  map.setView([lat,lng],map.getZoom())
  // 南昌标记
  if(!map._nanchangDot){
    L.circleMarker(NANCHANG,{radius:6,fillColor:'#07C160',color:'#fff',weight:2,fillOpacity:1})
      .addTo(map).bindTooltip('南昌发货',{direction:'bottom'})
    map._nanchangDot=true
  }
}
</script>
</body>
</html>
